name: Bug report
description: Something in the studio or a generated website does not work as expected.
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: "Security issue? Please do not file it here; see SECURITY.md."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Create a project…\n2. …"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Creative workflow (discover, brief, storyboard), Build and preview, HTML export, React export, Export ZIP, Providers and skills, Installer or updates, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Studio version and OS
      placeholder: "0.0.1 on macOS 15 (arm64)"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Activity log or screenshots
      description: Remove anything private before pasting.
