name: Feature request
description: Suggest an improvement to the studio or the websites it generates.
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
    validations:
      required: true
  - type: checkboxes
    id: parity
    attributes:
      label: Output targets
      options:
        - label: This affects generated websites, and should work in both HTML and React exports
